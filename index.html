<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SECURE.TERMINAL // DROP_ROOM</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Google Fonts for modern tech aesthetic -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Fira+Code:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- PeerJS for WebRTC -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <!-- LocalForage for IndexedDB persistence -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script>
</head>
<body>
    <div id="app">
        <!-- Login / Landing Screen -->
        <div id="landing-screen" class="screen active">
            <div class="terminal-header">
                <h1>Secure Drop</h1>
                <p class="subtitle">Encrypted P2P Local Node</p>
            </div>
            
            <div class="action-container">
                <div class="host-section box">
                    <h2>Host a Room</h2>
                    <p>Create a persistent secure enclave.</p>
                    <input type="text" id="room-name-input" placeholder="Room Name (e.g. ALPHA)">
                    <button id="btn-host" class="btn primary">Initialize Server</button>
                    <!-- Display existing rooms if any -->
                    <div id="existing-rooms-container" class="hidden">
                        <h3>> STORED_ROOMS</h3>
                        <div id="stored-rooms-list"></div>
                    </div>
                </div>

                <div class="divider"><span>// OR //</span></div>

                <div class="join-section box">
                    <h2>Join a Room</h2>
                    <p>Enter access PIN to sync data.</p>
                    <div class="input-group">
                        <input type="text" id="pin-input" placeholder="XXXX" maxlength="4" pattern="\d*">
                        <button id="btn-join" class="btn secondary">Connect</button>
                    </div>
                </div>
            </div>
            <div id="connection-status" class="status-msg"></div>
        </div>

        <!-- Waiting for Peer Screen -->
        <div id="waiting-screen" class="screen">
            <div class="box">
                <h1>Room Initialized</h1>
                <p>ROOM NAME: <span id="display-room-name" class="highlight"></span></p>
                <p>ACCESS PIN:</p>
                <div class="pin-display" id="display-pin">----</div>
                <p class="waiting-text blink">Waiting for peer connection...</p>
                <button id="btn-cancel-waiting" class="btn secondary" style="margin-top:20px;">Abort</button>
            </div>
        </div>

        <!-- Chat / Share Screen -->
        <div id="chat-screen" class="screen chat-layout">
            <div class="chat-header">
                <div class="room-info">
                    <h2><span id="chat-room-name">UNKNOWN</span> <span class="pin-badge">PIN: <span id="chat-room-pin"></span></span></h2>
                    <div class="status-indicator"><span class="status-dot"></span> <span id="peer-status">WAITING...</span></div>
                </div>
                <div class="header-actions">
                    <button id="btn-delete-room" class="btn-icon danger hidden" title="Wipe Database">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                    </button>
                    <button id="btn-leave" class="btn-icon" title="Disconnect">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                    </button>
                </div>
            </div>
            
            <div class="chat-messages" id="chat-messages">
                <!-- Messages go here -->
            </div>

            <!-- Bottom Input Bar (WhatsApp style) -->
            <div class="chat-input-area">
                <input type="file" id="file-input" class="hidden">
                <button id="btn-attach" class="btn-icon attach-btn" title="Upload Payload">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                </button>
                <input type="text" id="message-input" placeholder="Type a message..." autocomplete="off">
                <button id="btn-send" class="btn-icon send-btn" title="Transmit">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                </button>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
